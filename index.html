<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PCB Viewer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<script src="theme.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>PCB Viewer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="apple-touch-icon" href="icon-167.png" sizes="167x167">
<link rel="apple-touch-icon" href="icon-152.png" sizes="152x152">
<link rel="apple-touch-icon" href="icon-120.png" sizes="120x120">
<link rel="mask-icon" href="safari-pinned-tab.svg" color="#D80373">
<meta name="application-name" content="PCB Viewer">
<meta name="msapplication-TileColor" content="#D80373">
<meta name="msapplication-TileImage" content="mstile-150x150.png">
<meta name="msapplication-config" content="browserconfig.xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- PCB Viewer: zeigt Altium SchDoc/PcbDoc nur an (keine Bearbeitung). Dateien bleiben lokal im Browser. -->
<header id="kopf">
  <label class="tab pink oeffnen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:6px;flex:none"><path d="M3 19V6a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v2"/><path d="M3 19l3-8h16l-3 8z"/></svg>Öffnen<input id="datei" type="file" multiple accept=".SchDoc,.PcbDoc,.PrjPcb,.zip,.schdoc,.pcbdoc,.prjpcb"></label>
  <div id="projekt" class="projekt"></div>
  <nav id="tabs">
    <form class="sucheWrap" id="sucheWrap" role="search" action="#" hidden><input id="suche" type="search" enterkeyhint="search" inputmode="search" list="desListe" placeholder="Bauteil suchen" autocomplete="off" autocapitalize="characters" spellcheck="false"><datalist id="desListe"></datalist></form>
    <div class="ansicht2" id="ansichtTabs" hidden><button type="button" class="tab icon an" data-p="sch" title="Schaltbild" aria-label="Schaltbild" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h8M14 12h8M10 5v14M14 5v14"/></svg></button><button type="button" class="tab icon an" data-p="pcb" title="Leiterplatte" aria-label="Leiterplatte" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.6"/><circle cx="16" cy="15" r="1.6"/><path d="M9.6 9H13l3 4.4"/></svg></button></div>
  </nav>
</header>
<main>
  <section id="v-start" class="willkommen">
    <div class="wkarte" id="ablage">
      <span class="wbeak" aria-label="BEAK"><span class="bl">B&nbsp;E&nbsp;A&nbsp;K</span><span class="bd">•</span></span>
      <img class="wicon" src="icon-180.png" alt="" width="72" height="72">
      <h1 class="wtitel">PCB Viewer</h1>
      <p class="wsub">Schaltplan und Leiterplatte ansehen</p>
      <div class="waktionen">
        <label class="wbtn primary" id="wOeffnen"><input type="file" id="datei2" multiple accept=".SchDoc,.PcbDoc,.PrjPcb,.zip,.schdoc,.pcbdoc,.prjpcb" hidden>Öffnen</label>
        <button id="beispiel" class="wbtn">Beispiel öffnen</button>
      </div>
      <p id="meldung" class="meldung"></p>
      <p class="wversion" id="wversion">PCB Viewer</p>
        <p class="wversion wlizenz">Freie Software unter <a href="LICENSE" target="_blank" rel="noopener">AGPL-3.0</a> · <a href="https://github.com/beak-electronic/pcb-viewer" target="_blank" rel="noopener">Quellcode</a> · Altium-Strichschrift aus <a href="https://github.com/wavenumber-eng/altium_monkey" target="_blank" rel="noopener">altium_monkey</a></p>
    </div>
  </section>
  <section id="v-view" class="ansicht beide" hidden>
    <div class="panes" id="panes">
    <div class="karte pane" id="p-sch">
      <div class="leiste"><div class="menuWrap titelWrap" id="blattWrap"><h3 id="schTitel" class="titel">Schaltplan</h3><div class="menu karte links" id="blattMenu" hidden></div></div><span class="fuell"></span><button class="klein icon" data-fit="sch" title="Einpassen" aria-label="Einpassen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
      <div class="flaeche papier" id="f-sch"><svg id="svg-sch" xmlns="http://www.w3.org/2000/svg"></svg><div class="leer" id="leer-sch">Kein Schaltplan geladen</div><div class="info" id="info" hidden></div></div>
    </div>
    <div class="trenner" id="trenner" role="separator" aria-orientation="vertical" title="Ziehen, um die Aufteilung zu ändern"><span></span></div>
    <div class="karte pane" id="p-pcb">
      <div class="leiste"><div class="menuWrap titelWrap" id="platWrap"><h3 id="pcbTitel" class="titel">Leiterplatte</h3><div class="menu karte links" id="platMenu" hidden></div></div><span class="fuell"></span><div class="umschalter klein" id="dim"><button data-d="2d" class="an icon" title="2D" aria-label="2D"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/><rect x="9" y="10" width="6" height="4" fill="currentColor" stroke="none"/></svg></button><button data-d="3d" class="icon" title="3D" aria-label="3D"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-4 9 4-9 4z"/><path d="M3 11v3l9 4 9-4v-3"/><path d="M12 15v3"/></svg></button></div>
        <button class="klein icon" id="neigKnopf" title="Neigungssensor" aria-label="Neigungssensor" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="15" rx="1.6" transform="rotate(18 12 10.5)"/><path d="M3 15a9 9 0 0 0 5 5.5M21 9a9 9 0 0 0-5-5.5"/></svg></button><div class="umschalter klein" id="seite"><button data-s="oben" class="an icon" title="Oben" aria-label="Oben"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="11" width="18" height="2"/><rect x="8" y="5" width="8" height="5"/></svg></button><button data-s="unten" class="icon" title="Unten" aria-label="Unten"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="11" width="18" height="2"/><rect x="8" y="14" width="8" height="5"/></svg></button></div><button class="klein icon" id="ebenenKnopf" title="Ebenen" aria-label="Ebenen" aria-pressed="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="3" width="18" height="2"/><rect x="3" y="7" width="18" height="3" fill-opacity=".45"/><rect x="3" y="11" width="18" height="2"/><rect x="3" y="15" width="18" height="3" fill-opacity=".45"/><rect x="3" y="19" width="18" height="2"/></svg></button><button class="klein icon" data-fit="pcb" title="Einpassen" aria-label="Einpassen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
      <div class="flaeche platine" id="f-pcb"><svg id="svg-pcb" xmlns="http://www.w3.org/2000/svg"></svg><div id="drei" hidden></div><div class="leer" id="leer-pcb">Keine Leiterplatte geladen</div>
        <div id="ebenen" class="ebenenleiste" hidden></div></div>
    </div>
    </div>
  </section>
</main>
<script src="version.js"></script>
<script src="altium.js"></script>
<script src="strichschrift.js"></script>
<script src="app.js"></script>
</body>
</html>
